[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myEasyMP3toIPhone"
version = "0.1.0"
description = "Musica sul PC e sull'iPhone: tag, album completi, scansione dei problemi con l'AI."
authors = [{name = "Antonio Romeo"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "mutagen>=1.47", "pymobiledevice3>=11.0", "requests>=2.31", "keyring>=24",
                "anthropic>=2.12", "pywin32>=306"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["myeasymp3toiphone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
